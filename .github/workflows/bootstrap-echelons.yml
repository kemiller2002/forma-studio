name: Bootstrap Echelon Capabilities

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-echelons.yml
      - scripts/bootstrap-capabilities.sh
      - capabilities.lock.json
  push:
    branches:
      - feature/bootstrap-requirements
    paths:
      - .github/workflows/bootstrap-echelons.yml
      - scripts/bootstrap-capabilities.sh
      - capabilities.lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-studio-capability-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Echelon capabilities
        run: bash scripts/bootstrap-capabilities.sh

      - name: Build ROS generated registries
        run: ./ros registry build

      - name: Validate repository-owned baseline
        run: |
          node scripts/validate-requirements.mjs
          node scripts/validate-schema.mjs

      - name: Commit generated lifecycle state
        id: commit
        shell: bash
        run: |
          git config user.name "Echelon Bootstrap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Capability state already current."
          else
            git commit -m "chore: install current Echelon engineering capabilities"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate governed repository after commit
        run: |
          ./ros registry check
          ./ros validate
          ./ros verify --strict
          npx --yes @echelon-foundry/sde@1.3.0 verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          CE_SHA=4590d2fe6f7e80b339117d3fbee5803f2dd39122
          CE_TMP="$(mktemp -d)"
          curl -fsSL "https://github.com/kemiller2002/communication-engineering/archive/${CE_SHA}.tar.gz" | tar -xz -C "$CE_TMP"
          node "$CE_TMP/communication-engineering-${CE_SHA}/bin/communication-engineering.mjs" verify --root "$PWD" --strict
          rm -rf "$CE_TMP"
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict

      - name: Push generated lifecycle state
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.head_ref || github.ref_name }}
