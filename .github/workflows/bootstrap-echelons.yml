name: Bootstrap Echelon Capabilities

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-studio-capability-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Echelon capabilities
        run: bash scripts/bootstrap-capabilities.sh

      - name: Build ROS generated registries
        run: ./ros registry build

      - name: Validate repository-owned baseline
        run: |
          node scripts/validate-requirements.mjs
          node scripts/validate-schema.mjs

      - name: Commit generated lifecycle state
        id: commit
        shell: bash
        run: |
          git config user.name "Echelon Bootstrap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Capability state already current."
          else
            git commit -m "chore: install current Echelon engineering capabilities"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate governed repository after commit
        run: |
          ./ros registry check
          ./ros validate
          ./ros verify --strict
          # Ordo (formerly @echelon-foundry/sde) is a native release since 1.6; run the
          # version and digest Conditor recorded in the resolved set, nothing pinned by hand.
          set_file=.conditor/authority/resolved-release-set.json
          ORDO_VERSION="$(jq -r '.components[] | select(.systemId == "ordo") | .version' "$set_file")"
          ORDO_SHA256="$(jq -r '.components[] | select(.systemId == "ordo") | .artifacts[] | select(.name == "ordo-linux-x64.tar.gz") | .sha256' "$set_file")"
          ORDO_TMP="$(mktemp -d)"
          GH_TOKEN="${{ github.token }}" gh release download "v${ORDO_VERSION}" -R kemiller2002/ordo -p ordo-linux-x64.tar.gz -D "$ORDO_TMP"
          echo "${ORDO_SHA256}  $ORDO_TMP/ordo-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf "$ORDO_TMP/ordo-linux-x64.tar.gz" -C "$ORDO_TMP"
          "$ORDO_TMP/ordo-linux-x64/ordo" verify
          rm -rf "$ORDO_TMP"
          npx --yes @echelon-foundry/visual-engineering@1.0.1 verify --strict
          CE_SHA=4590d2fe6f7e80b339117d3fbee5803f2dd39122
          CE_TMP="$(mktemp -d)"
          curl -fsSL "https://github.com/kemiller2002/communication-engineering/archive/${CE_SHA}.tar.gz" | tar -xz -C "$CE_TMP"
          node "$CE_TMP/communication-engineering-${CE_SHA}/bin/communication-engineering.mjs" verify --root "$PWD" --strict
          rm -rf "$CE_TMP"
          npx --yes "@echelon-foundry/limen@$(node -p "require('./.echelon/limen.json').installedVersion")" verify --strict

      - name: Push generated lifecycle state
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}
