name: Forma Studio engineering validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts

      - name: Materialize ignored Visual Engineering context
        run: npx --yes @echelon-foundry/visual-engineering@1.0.0 init

      - name: Verify Echelon lifecycle state
        run: |
          ./ros registry check
          ./ros validate
          ./ros verify --strict
          npx --yes @echelon-foundry/sde@1.3.0 verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          CE_SHA=4590d2fe6f7e80b339117d3fbee5803f2dd39122
          CE_TMP="$(mktemp -d)"
          curl -fsSL "https://github.com/kemiller2002/communication-engineering/archive/${CE_SHA}.tar.gz" | tar -xz -C "$CE_TMP"
          node "$CE_TMP/communication-engineering-${CE_SHA}/bin/communication-engineering.mjs" verify --root "$PWD" --strict
          rm -rf "$CE_TMP"
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict

      - name: Vendored Forma matches its release commit and the published Forma packages
        run: npm run vendor:release

      - name: Restore and build F# engine with Aegis
        run: |
          dotnet restore src/engine/FormaStudio.Engine/FormaStudio.Engine.fsproj
          dotnet build src/engine/FormaStudio.Engine/FormaStudio.Engine.fsproj -c Release --no-restore

      - name: Test F# engine (commands, history, persistence, appearance, disclosure)
        run: dotnet run --project tests/FormaStudio.Engine.Tests/FormaStudio.Engine.Tests.fsproj -c Release

      - name: HTML export is deterministic (reference designs, workflows)
        run: npm run html:check

      - name: Build the Flow editor (F# engine on .NET WebAssembly + Limen kernel)
        run: npm run app:build

      - name: Test the editor, workflow surface, external round trip and HTML consumer in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run app:test

      - name: Validate requirements and project schema
        run: |
          npm run requirements:validate
          npm run schema:validate

      - name: Build Forma-backed marketing site
        run: npm run site:build
