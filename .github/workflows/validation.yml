name: Repository validation

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: forma-studio-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for commit batch
        run: sleep 600

  validate:
    needs: debounce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s REQUIREMENTS.md
          ! grep -RIn --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' .
