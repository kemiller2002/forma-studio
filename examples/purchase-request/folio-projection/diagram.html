        <path class="ef-diagram-connector" id="fs-purchase-request-e-yes" d="M454 388 L539 388 L624 388" marker-end="url(#fs-purchase-request-arrow)"/>
        <path class="ef-diagram-connector" id="fs-purchase-request-e-no" data-ef-line="dashed" d="M454 388 L539 388 L539 158 L624 158" marker-end="url(#fs-purchase-request-arrow)"/>

        <h3 class="ef-diagram-node__label" id="fs-purchase-request-submitted-label">Request submitted</h3>
      </article>
      <article class="ef-diagram-node" id="fs-purchase-request-prepare" data-ef-shape="rounded" aria-labelledby="fs-purchase-request-prepare-label" style="--ef-diagram-x: 274px; --ef-diagram-y: 74px; --ef-diagram-w: 210px; --ef-diagram-h: 168px; --ef-diagram-fill: #efe6fb; --ef-diagram-accent: #6b3fa0;">

        <h3 class="ef-diagram-node__label" id="fs-purchase-request-prepare-label">Prepare request</h3>

      </article>
      <article class="ef-diagram-node" id="fs-purchase-request-revise" data-ef-shape="rounded" aria-labelledby="fs-purchase-request-revise-label" style="--ef-diagram-x: 624px; --ef-diagram-y: 74px; --ef-diagram-w: 210px; --ef-diagram-h: 168px; --ef-diagram-fill: #e3f4e1; --ef-diagram-accent: #2e6b2a;">
        <p class="ef-diagram-node__kind">Activity</p>
        <h3 class="ef-diagram-node__label" id="fs-purchase-request-revise-label">Revise request</h3>
        <dl class="ef-diagram-node__meta"><dt>Status</dt><dd>Blocked</dd><dt>Owner</dt><dd>Requester <span class="ef-diagram-value-state" data-ef-value-state="derived">derived from lane</span></dd><dt>Phase</dt><dd>Intake</dd></dl>
      </article>
      <article class="ef-diagram-node" id="fs-purchase-request-budget-check" data-ef-shape="diamond" aria-labelledby="fs-purchase-request-budget-check-label" style="--ef-diagram-x: 304px; --ef-diagram-y: 313px; --ef-diagram-w: 150px; --ef-diagram-h: 150px; --ef-diagram-stroke: var(--ef-color-accent-primary); --ef-diagram-accent: var(--ef-color-accent-primary);">
        <p class="ef-diagram-node__kind">Decision</p>
        <h3 class="ef-diagram-node__label" id="fs-purchase-request-budget-check-label">Within budget?</h3>

        <h3 class="ef-diagram-node__label" id="fs-purchase-request-order-label">Issue purchase order</h3>

        <h3 class="ef-diagram-node__label" id="fs-purchase-request-placed-label">Order placed</h3>
      </article>
      <span class="ef-diagram-connector__label" style="--ef-diagram-x: 462px; --ef-diagram-y: 392px;">yes, within budget</span>
      <span class="ef-diagram-connector__label" style="--ef-diagram-x: 545px; --ef-diagram-y: 263px;">no, over budget</span>
      <span class="ef-diagram-connector__label" style="--ef-diagram-x: 387px; --ef-diagram-y: 28px;">resubmit</span>
    </div>
  </div>
  <ol class="ef-diagram__relations" aria-label="Relationships">
    <li>Request submitted leads to Prepare request (solid line).</li>
    <li>Prepare request leads to Within budget? (solid line).</li>
    <li>Within budget? leads to Approve spend: yes, within budget (solid line).</li>
    <li>Within budget? leads to Revise request: no, over budget (dashed line).</li>
    <li>Revise request leads to Prepare request: resubmit (dotted line).</li>
    <li>Approve spend leads to Issue purchase order (solid line).</li>
    <li>Issue purchase order leads to Order placed (solid line).</li>
  </ol>
  <ul aria-label="Lanes">
    <li>Requester: Request submitted, Prepare request, Revise request</li>
    <li>Finance: Within budget?, Approve spend</li>
    <li>Procurement: Issue purchase order, Order placed</li>
  </ul>
  <dl class="ef-diagram-legend" aria-label="Key: what color means in this diagram">
    <div><dt><span class="ef-diagram-legend__swatch" style="--ef-diagram-fill: #fde8d7; --ef-diagram-accent: #9a3b00;"></span> Status is Blocked</dt><dd>fill from the status color mapping</dd></div>
    <div><dt><span class="ef-diagram-legend__swatch" style="--ef-diagram-stroke: var(--ef-color-accent-primary); --ef-diagram-accent: var(--ef-color-accent-primary);"></span> Decision emphasis</dt><dd>named style, presentation only</dd></div>
    <div><dt><span class="ef-diagram-legend__swatch" style="--ef-diagram-fill: #efe6fb; --ef-diagram-accent: #6b3fa0;"></span> Author highlight</dt><dd>chosen by the author; it carries no status</dd></div>
    <div><dt><span class="ef-diagram-legend__swatch"></span> Other author colors</dt><dd>chosen by the author; they carry no status</dd></div>
    <div><dt><span class="ef-diagram-legend__swatch"></span> No mapping or author color</dt><dd>Forma default</dd></div>
  </dl>
</figure>
