<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Launch readiness poll</title>
    <link rel="stylesheet" href="assets/forma/tokens.css">
    <link rel="stylesheet" href="assets/forma/foundations.css">
    <link rel="stylesheet" href="assets/forma/components.css">
  </head>
  <body>
    <main>
      <figure class="forma-diagram" id="wf-branching" aria-labelledby="wf-branching-title">
        <figcaption id="wf-branching-title">Launch readiness poll</figcaption>
        <div class="forma-diagram__viewport" tabindex="0" role="group" aria-label="Launch readiness poll diagram, scroll to see all items">
          <div class="forma-diagram__canvas" style="--forma-diagram-canvas-w: 74.8125rem; --forma-diagram-canvas-h: 18.75rem;">
            <svg class="forma-diagram__wires" viewBox="0 0 1197 300" aria-hidden="true" focusable="false">
              <defs>
                <marker id="wf-branching-arrow" class="forma-diagram-marker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M0 0 L10 5 L0 10 z" />
                </marker>
              </defs>
              <path class="forma-diagram-connector" id="wf-branching-e-e-poll" d="M224 88 L279.5 88 L279.5 132 L335 132" marker-end="url(#wf-branching-arrow)" />
              <path class="forma-diagram-connector" id="wf-branching-e-e-yes" d="M551 132 L606.5 132 L606.5 188 L662 188" marker-end="url(#wf-branching-arrow)" />
              <path class="forma-diagram-connector" id="wf-branching-e-e-no" data-forma-line="dashed" d="M551 132 L606.5 132 L606.5 64 L662 64" marker-end="url(#wf-branching-arrow)" />
              <path class="forma-diagram-connector" id="wf-branching-e-e-fix" d="M862 64 L917.5 64 L917.5 76 L973 76" marker-end="url(#wf-branching-arrow)" />
              <path class="forma-diagram-connector" id="wf-branching-e-e-repoll" data-forma-line="dotted" d="M1073 128 L973 76 L973 264 L443 264 L443 240" marker-end="url(#wf-branching-arrow)" />
            </svg>
            <article class="forma-diagram-node" id="wf-branching-n-poll" data-forma-shape="pill" aria-labelledby="wf-branching-n-poll-label" style="--forma-diagram-x: 1.5rem; --forma-diagram-y: 1.5rem; --forma-diagram-w: 12.5rem; --forma-diagram-h: 8rem;">
              <p class="forma-diagram-node__kind">Start</p>
              <h3 class="forma-diagram-node__label" id="wf-branching-n-poll-label">Begin readiness poll</h3>
            </article>
            <article class="forma-diagram-node" id="wf-branching-n-go" data-forma-shape="diamond" aria-labelledby="wf-branching-n-go-label" style="--forma-diagram-x: 20.9375rem; --forma-diagram-y: 1.5rem; --forma-diagram-w: 13.5rem; --forma-diagram-h: 13.5rem;">
              <p class="forma-diagram-node__kind">Decision</p>
              <h3 class="forma-diagram-node__label" id="wf-branching-n-go-label">All stations go?</h3>
            </article>
            <article class="forma-diagram-node" id="wf-branching-n-hold" data-forma-shape="rounded" aria-labelledby="wf-branching-n-hold-label" style="--forma-diagram-x: 41.375rem; --forma-diagram-y: 1.5rem; --forma-diagram-w: 12.5rem; --forma-diagram-h: 5rem;">
              <p class="forma-diagram-node__kind">Task</p>
              <h3 class="forma-diagram-node__label" id="wf-branching-n-hold-label">Call a hold</h3>
            </article>
            <article class="forma-diagram-node" id="wf-branching-n-launch" data-forma-shape="pill" aria-labelledby="wf-branching-n-launch-label" style="--forma-diagram-x: 41.375rem; --forma-diagram-y: 8.5rem; --forma-diagram-w: 12.5rem; --forma-diagram-h: 6.5rem;">
              <p class="forma-diagram-node__kind">End</p>
              <h3 class="forma-diagram-node__label" id="wf-branching-n-launch-label">Proceed to launch</h3>
            </article>
            <article class="forma-diagram-node" id="wf-branching-n-resolve" data-forma-shape="rounded" aria-labelledby="wf-branching-n-resolve-label" style="--forma-diagram-x: 60.8125rem; --forma-diagram-y: 1.5rem; --forma-diagram-w: 12.5rem; --forma-diagram-h: 6.5rem;">
              <p class="forma-diagram-node__kind">Task</p>
              <h3 class="forma-diagram-node__label" id="wf-branching-n-resolve-label">Resolve the issue</h3>
            </article>
            <span class="forma-diagram-connector__label" aria-hidden="true" style="--forma-diagram-x: 37rem; --forma-diagram-y: 9.3125rem;">Go</span>
            <span class="forma-diagram-connector__label" aria-hidden="true" style="--forma-diagram-x: 36.0625rem; --forma-diagram-y: 5.4375rem;">No go</span>
            <span class="forma-diagram-connector__label" aria-hidden="true" style="--forma-diagram-x: 42.3125rem; --forma-diagram-y: 15.8125rem;">Repoll</span>
          </div>
        </div>
        <ol class="forma-diagram__relations" aria-label="Relationships">
          <li>Begin readiness poll leads to All stations go?</li>
          <li>All stations go? leads to Proceed to launch: “Go”; conditional.</li>
          <li>All stations go? leads to Call a hold: “No go”; conditional; dashed line.</li>
          <li>Call a hold leads to Resolve the issue.</li>
          <li>Resolve the issue leads to All stations go?: “Repoll”; dotted line.</li>
        </ol>
      </figure>
    </main>
  </body>
</html>
