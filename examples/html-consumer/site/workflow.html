<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Launch readiness</title>
    <link rel="stylesheet" href="assets/forma/tokens.css">
    <link rel="stylesheet" href="assets/forma/foundations.css">
    <link rel="stylesheet" href="assets/forma/components.css">
  </head>
  <body>
    <main>
      <div class="ef-stack" data-density="standard">
        <h1>Launch readiness</h1>
        <p>The poll below is a portable Forma workflow. Every relationship is also listed in text.</p>
        <figure class="ef-diagram" id="wf-branching" aria-labelledby="wf-branching-title">
          <figcaption id="wf-branching-title">Launch readiness poll</figcaption>
          <div class="ef-diagram__viewport" tabindex="0" role="group" aria-label="Launch readiness poll diagram, scroll to see all items">
            <div class="ef-diagram__canvas" style="--ef-diagram-canvas-w: 74.8125rem; --ef-diagram-canvas-h: 18.75rem;">
              <svg class="ef-diagram__wires" viewBox="0 0 1197 300" aria-hidden="true" focusable="false">
                <defs>
                  <marker id="wf-branching-arrow" class="ef-diagram-marker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M0 0 L10 5 L0 10 z" />
                  </marker>
                </defs>
                <path class="ef-diagram-connector" id="wf-branching-e-e-poll" d="M224 88 L279.5 88 L279.5 132 L335 132" marker-end="url(#wf-branching-arrow)" />
                <path class="ef-diagram-connector" id="wf-branching-e-e-yes" d="M551 132 L606.5 132 L606.5 188 L662 188" marker-end="url(#wf-branching-arrow)" />
                <path class="ef-diagram-connector" id="wf-branching-e-e-no" data-ef-line="dashed" d="M551 132 L606.5 132 L606.5 64 L662 64" marker-end="url(#wf-branching-arrow)" />
                <path class="ef-diagram-connector" id="wf-branching-e-e-fix" d="M862 64 L917.5 64 L917.5 76 L973 76" marker-end="url(#wf-branching-arrow)" />
                <path class="ef-diagram-connector" id="wf-branching-e-e-repoll" data-ef-line="dotted" d="M1073 128 L973 76 L973 264 L443 264 L443 240" marker-end="url(#wf-branching-arrow)" />
              </svg>
              <article class="ef-diagram-node" id="wf-branching-n-poll" data-ef-shape="pill" aria-labelledby="wf-branching-n-poll-label" style="--ef-diagram-x: 1.5rem; --ef-diagram-y: 1.5rem; --ef-diagram-w: 12.5rem; --ef-diagram-h: 8rem;">
                <p class="ef-diagram-node__kind">Start</p>
                <h3 class="ef-diagram-node__label" id="wf-branching-n-poll-label">Begin readiness poll</h3>
              </article>
              <article class="ef-diagram-node" id="wf-branching-n-go" data-ef-shape="diamond" aria-labelledby="wf-branching-n-go-label" style="--ef-diagram-x: 20.9375rem; --ef-diagram-y: 1.5rem; --ef-diagram-w: 13.5rem; --ef-diagram-h: 13.5rem;">
                <p class="ef-diagram-node__kind">Decision</p>
                <h3 class="ef-diagram-node__label" id="wf-branching-n-go-label">All stations go?</h3>
              </article>
              <article class="ef-diagram-node" id="wf-branching-n-hold" data-ef-shape="rounded" aria-labelledby="wf-branching-n-hold-label" style="--ef-diagram-x: 41.375rem; --ef-diagram-y: 1.5rem; --ef-diagram-w: 12.5rem; --ef-diagram-h: 5rem;">
                <p class="ef-diagram-node__kind">Task</p>
                <h3 class="ef-diagram-node__label" id="wf-branching-n-hold-label">Call a hold</h3>
              </article>
              <article class="ef-diagram-node" id="wf-branching-n-launch" data-ef-shape="pill" aria-labelledby="wf-branching-n-launch-label" style="--ef-diagram-x: 41.375rem; --ef-diagram-y: 8.5rem; --ef-diagram-w: 12.5rem; --ef-diagram-h: 6.5rem;">
                <p class="ef-diagram-node__kind">End</p>
                <h3 class="ef-diagram-node__label" id="wf-branching-n-launch-label">Proceed to launch</h3>
              </article>
              <article class="ef-diagram-node" id="wf-branching-n-resolve" data-ef-shape="rounded" aria-labelledby="wf-branching-n-resolve-label" style="--ef-diagram-x: 60.8125rem; --ef-diagram-y: 1.5rem; --ef-diagram-w: 12.5rem; --ef-diagram-h: 6.5rem;">
                <p class="ef-diagram-node__kind">Task</p>
                <h3 class="ef-diagram-node__label" id="wf-branching-n-resolve-label">Resolve the issue</h3>
              </article>
              <span class="ef-diagram-connector__label" aria-hidden="true" style="--ef-diagram-x: 37rem; --ef-diagram-y: 9.3125rem;">Go</span>
              <span class="ef-diagram-connector__label" aria-hidden="true" style="--ef-diagram-x: 36.0625rem; --ef-diagram-y: 5.4375rem;">No go</span>
              <span class="ef-diagram-connector__label" aria-hidden="true" style="--ef-diagram-x: 42.3125rem; --ef-diagram-y: 15.8125rem;">Repoll</span>
            </div>
          </div>
          <ol class="ef-diagram__relations" aria-label="Relationships">
            <li>Begin readiness poll leads to All stations go?</li>
            <li>All stations go? leads to Proceed to launch: “Go”; conditional.</li>
            <li>All stations go? leads to Call a hold: “No go”; conditional; dashed line.</li>
            <li>Call a hold leads to Resolve the issue.</li>
            <li>Resolve the issue leads to All stations go?: “Repoll”; dotted line.</li>
          </ol>
        </figure>
      </div>
    </main>
  </body>
</html>
